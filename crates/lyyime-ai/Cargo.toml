[package]
name = "lyyime-ai"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "lyyIme AI 助手客户端(OpenAI 兼容 /chat/completions;lyyime-ibus 进程内复用,lyyime-xim 子进程调用)"

[lib]
name = "lyyime_ai"
path = "src/lib.rs"

[[bin]]
name = "lyyime-ai"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
