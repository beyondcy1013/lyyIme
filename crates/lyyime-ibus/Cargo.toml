[package]
name = "lyyime-ibus"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "lyyIme ibus 引擎(Mode A,Rust/zbus 直连 lyyime-core)"

[[bin]]
name = "ibus-engine-lyyime"
path = "src/main.rs"

[dependencies]
lyyime-core = { path = "../lyyime-core" }
lyyime-ai = { path = "../lyyime-ai" }
zbus = "4"
zvariant = { version = "4", features = ["gvariant"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
libc = { workspace = true }
toml = { workspace = true }
