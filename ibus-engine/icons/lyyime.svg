        fill="#3584e4" stroke="#1a5fb4" stroke-width="1"/>
  <text x="8" y="12.3" font-family="Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif"
        font-size="11.5" font-weight="bold" fill="#ffffff"
        text-anchor="middle">伍</text>
